<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="placeholder">
  <defs>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a44"/>
      <stop offset="1" stop-color="#0f0f12"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55555f"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#55555f"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a8a94" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#8a8a94" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="18" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <clipPath id="clipL"><path d="M 80 205 C 80 150 140 128 232 128 C 335 128 382 160 382 215 C 382 285 330 345 238 345 C 148 345 80 285 80 205 Z"/></clipPath>
    <clipPath id="clipR"><path d="M 80 205 C 80 150 140 128 232 128 C 335 128 382 160 382 215 C 382 285 330 345 238 345 C 148 345 80 285 80 205 Z" transform="translate(800 0) scale(-1 1)"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <!-- hastes -->
    <path d="M 84 190 L 20 150 L 26 132 L 96 168" fill="url(#frame)"/>
    <path d="M 716 190 L 780 150 L 774 132 L 704 168" fill="url(#frame)"/>

    <!-- lentes -->
    <path d="M 80 205 C 80 150 140 128 232 128 C 335 128 382 160 382 215 C 382 285 330 345 238 345 C 148 345 80 285 80 205 Z" fill="url(#lens)"/>
    <path d="M 80 205 C 80 150 140 128 232 128 C 335 128 382 160 382 215 C 382 285 330 345 238 345 C 148 345 80 285 80 205 Z" fill="url(#lens)" transform="translate(800 0) scale(-1 1)"/>

    <!-- reflexos -->
    <g clip-path="url(#clipL)"><rect x="60" y="100" width="340" height="280" fill="url(#shine)"/></g>
    <g clip-path="url(#clipR)"><rect x="400" y="100" width="340" height="280" fill="url(#shine)"/></g>
    <path d="M 120 165 C 170 140 240 138 300 150" stroke="#8a8a94" stroke-opacity="0.55" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 500 150 C 560 138 630 140 680 165" stroke="#8a8a94" stroke-opacity="0.55" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- armação -->
    <path d="M 80 205 C 80 150 140 128 232 128 C 335 128 382 160 382 215 C 382 285 330 345 238 345 C 148 345 80 285 80 205 Z" fill="none" stroke="url(#frame)" stroke-width="9" stroke-linejoin="round"/>
    <path d="M 80 205 C 80 150 140 128 232 128 C 335 128 382 160 382 215 C 382 285 330 345 238 345 C 148 345 80 285 80 205 Z" fill="none" stroke="url(#frame)" stroke-width="9" stroke-linejoin="round" transform="translate(800 0) scale(-1 1)"/>

    <!-- ponte -->
    <path d="M 378 190 C 385 160 415 160 422 190" fill="none" stroke="url(#frame)" stroke-width="9" stroke-linecap="round"/>
    <path d="M 372 215 C 385 195 415 195 428 215" fill="none" stroke="url(#frame)" stroke-width="5" stroke-linecap="round"/>

    <!-- parafusos -->
    <circle cx="352" cy="150" r="4.5" fill="#1a1a1f" stroke="url(#frame)" stroke-width="2"/>
    <circle cx="448" cy="150" r="4.5" fill="#1a1a1f" stroke="url(#frame)" stroke-width="2"/>
  </g>
</svg>
